name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11) matches local dev and the Vercel runtime. The
          # lockfile is written by npm 11; npm 10 — bundled with Node 22 —
          # rejects it as out of sync. Do not lower this without regenerating
          # package-lock.json with the matching npm.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Formatting
        run: npm run format:check
